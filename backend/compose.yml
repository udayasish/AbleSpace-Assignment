name: pyramid

services:
  postgres:
    image: postgres:16-alpine
    container_name: pyramid-postgres
    environment:
      POSTGRES_USER: pyramid
      POSTGRES_PASSWORD: pyramid
      POSTGRES_DB: pyramid
    # 5433 on the host to avoid clashing with other local Postgres containers.
    ports:
      - "5433:5432"
    volumes:
      - pyramid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyramid -d pyramid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pyramid_pgdata:
